name: Deploy to GitHub Pages

on:
  # Trigger on push to main
  push:
    branches: [main]
  # Allow manual dispatch from the Actions tab
  workflow_dispatch:

# Permissions necessary for `actions/deploy-pages@v4`
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid concurrent deploys; if a new push arrives while one is in flight,
# cancel the previous one (skip-wait keeps the queue tidy).
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check (astro check)
        run: npx astro check

      - name: Tests (vitest)
        run: npm test

      - name: Build
        run: npm run build
        env:
          PUBLIC_GCAL_API_KEY: ${{ secrets.PUBLIC_GCAL_API_KEY }}
          PUBLIC_GCAL_CALENDAR_ID: ${{ secrets.PUBLIC_GCAL_CALENDAR_ID }}
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}
          PUBLIC_WEB3FORMS_KEY_CONTACTO: ${{ secrets.PUBLIC_WEB3FORMS_KEY_CONTACTO }}
          PUBLIC_WEB3FORMS_KEY_REGALA: ${{ secrets.PUBLIC_WEB3FORMS_KEY_REGALA }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
